<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ranking · Pet DaFix</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/cliente/pet-ranking.css"/>
</head>
<body>
<header class="rk-header">
  <a href="/cliente/index.html" class="rk-brand">
    <img src="/assets/logo.png" alt="" width="34" height="34" aria-hidden="true">
    <span>Da<strong>Fix</strong></span>
  </a>
  <nav><a href="/cliente/index.html">← Voltar ao painel</a></nav>
</header>

<main class="rk-main">
  <section class="rk-hero">
    <div class="rk-hero-emoji">🏆</div>
    <h1>Ranking Global</h1>
    <p>Ordenado por <strong>Nível do Pet</strong> · desempate por <strong>Streak (🔥)</strong></p>
    <div class="rk-hero-meta" id="rk-meta">Carregando…</div>
  </section>

  <div class="rk-toolbar">
    <button class="rk-tab is-active" data-scope="geral">Geral</button>
    <button class="rk-tab" data-scope="mes">Este mês</button>
    <button class="rk-tab" data-scope="semana">Esta semana</button>
    <input class="rk-search" id="rk-search" type="search" placeholder="Buscar por nome…"/>
  </div>

  <div class="rk-podium" id="rk-podium"></div>
  <ul class="rk-list" id="rk-list" aria-live="polite"></ul>
  <div class="rk-empty" id="rk-empty" hidden>
    <span>🐣</span>
    <h3>Ninguém no ranking ainda</h3>
    <p>Abra o app, alimente seu pet e mantenha o streak para aparecer aqui.</p>
  </div>
</main>

<div class="rk-toast-wrap" id="rk-toasts" aria-live="polite"></div>
<script src="/cliente/pet-ranking.js" defer></script>
</body>
</html>
